# Groovy Operations — CI
#
# Runs on every push and pull request. No dependencies to install: the tests
# are plain node, same zero-new-deps policy as the app.
#
# What this proves: the logic still holds, every js module is wired into
# index.html AND sw.js, no credentials are in client code, every collection
# the client touches has a firestore.rules match block, CACHE_VERSION was
# bumped when a precached file changed, and every classic script loads and
# runs in a real browser with the vendored libraries working.
#
# The layout check is the one thing here that can SEE a page: it renders
# real markup with the real stylesheet in a real browser and measures it,
# failing on text squeezed to zero width or a box that overflows itself.
# It exists because the Profile directory shipped with every name at
# exactly 0px wide and every logic suite stayed green.
#
# What it still does NOT prove: that a page looks GOOD, or that anything
# works signed in. See the header of tests/harness.js. Real UI verification
# still needs a human, a phone, or Claude in Chrome.
name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The CACHE_VERSION guard diffs against the base, so it needs more
          # than the default single-commit clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check every shipped script
        run: |
          set -e
          for f in js/*.js sw.js tests/*.js; do
            node --check "$f"
          done
          echo "all scripts parse"

      - name: Run the test suites
        run: node tests/run.js

      # Only possible because the runtime libraries are vendored rather than
      # CDN-loaded. Skips itself cleanly if the runner has no browser.
      - name: Browser smoke test
        run: node tests/smoke-browser.js

      # The app must render even when a Firestore read never settles.
      - name: startApp smoke test
        run: node tests/smoke-startapp.js

      # Measures real geometry — catches text with nowhere to go.
      - name: Layout smoke test
        run: node tests/smoke-layout.js

      - name: CACHE_VERSION was bumped
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          node tests/check-cache-version.js "$BASE"
