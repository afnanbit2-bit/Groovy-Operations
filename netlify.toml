[build]
  publish = "."

# Global — every context (production, deploy previews, branch deploys) builds
# the same way. Scoped to production only, previews ran on a different Node
# and with smart secret detection on, which flags the public Firebase web API
# key that index.html is required to ship in the clear.
[build.environment]
  NODE_VERSION = "18"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── Scheduled functions (cron, UTC) ──────────────────────────────
# 4am UTC = 9am PKT — daily catalog sync (products + variants)
[functions."shopify-catalog-sync"]
  schedule = "0 4 * * *"

# 5am + 5pm UTC = 10am + 10pm PKT — twice-daily inventory snapshot
[functions."shopify-inventory-snapshot"]
  schedule = "0 5,17 * * *"

# Every 4 hours — incremental order sync (last 48h, skip existing)
[functions."shopify-order-sync"]
  schedule = "0 */4 * * *"

# Every 4 hours at :20 (offset from the order sync above) — status refresh of
# orders already held: later refunds and cancellations (updated_at_min window,
# 48h overlap, resumable). See netlify/lib/shopify-order-refresh.js. The
# owners' on-demand twin is shopify-order-refresh-now-background (no schedule).
[functions."shopify-order-refresh-background"]
  schedule = "20 */4 * * *"

# Every 4 hours — read-only PostEx COD sync (14-day rolling lookback).
# Background function (15-min budget); the PostEx API is too slow for a 10s
# synchronous function. Check results via /.netlify/functions/postex-status.
[functions."postex-sync-background"]
  schedule = "0 */4 * * *"

# Daily 3am UTC = 8am PKT — enrich delivered/returned parcels with CPR /
# payment-status data (one call per tracking number, incremental).
[functions."postex-payments-background"]
  schedule = "0 3 * * *"

# 1:30am UTC = 6:30am PKT — Marketing discount-code redemption rollup
# (counts orders per code; see netlify/functions/marketing-code-rollup.js)
[functions."marketing-code-rollup"]
  schedule = "30 1 * * *"

# 2:15am UTC = 7:15am PKT — Instagram token health check (bell warning
# 14 days before expiry; see netlify/functions/instagram-token-refresh.js)
[functions."instagram-token-refresh"]
  schedule = "15 2 * * *"

# 3am UTC = 8am PKT — The Board's reminder: due today + overdue, one row per
# item per person per day (see netlify/functions/board-reminder.js)
[functions."board-reminder"]
  schedule = "0 3 * * *"

# 2am UTC Saturday = 7am PKT — weekly close rollup
[functions."shopify-weekly-close"]
  schedule = "0 2 * * 6"

# Every hour at :30 — Master Accounts backup (see netlify/functions/ma-backup.js).
# The EXPORT still runs once a day: at the first wake at or after 03:30 UTC =
# 08:30 PKT (the plan's time, MASTER_ACCOUNTS_PLAN.md §30). The other wakes only
# record how a running export ended, so a failed backup reaches the Today page
# within the hour instead of being buried by the next night's run.
[functions."ma-backup"]
  schedule = "30 * * * *"

# 3:45am UTC = 8:45am PKT — Master Accounts courier rollup: PostEx parcels into
# the couriers' documents (see netlify/functions/ma-rollup-background.js), after
# the 03:00 UTC PostEx payments run. A background function, like the PostEx syncs.
[functions."ma-rollup-background"]
  schedule = "45 3 * * *"

# ── Cache control ──────────────────────────────────────────────
# index.html must always be revalidated so a new deploy's bumped
# ?v= query strings on the JS/CSS reach the browser immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Vendored libraries carry their version in the FILENAME (see
# assets/vendor/README.md), so a given URL's bytes never change. Serving them
# immutable means a returning visitor never revalidates 1.3 MB of library
# code. An upgrade is a new filename, never an edit in place.
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker script itself must always be revalidated — otherwise a
# stale sw.js could sit in the CDN/browser HTTP cache and a deploy's cache
# version bump (and its old-cache cleanup) would never be picked up.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── ZKTeco attendance clock push (ADMS/iclock) ─────────────────
# The clock's firmware hardcodes the /iclock/ path; route it to the
# receiver Function. MUST sit above the SPA catch-all below.
[[redirects]]
  from = "/iclock/*"
  to = "/.netlify/functions/iclock/:splat"
  status = 200
  force = true

# ── Phone share target (manifest.json share_target) ─────────────
# The service worker answers POST /share-target itself. This only fires
# when no worker controls the page (first open, or storage cleared): the
# share is lost, but the person lands in the app instead of an error.
# MUST sit above the SPA catch-all below.
[[redirects]]
  from = "/share-target"
  to = "/index.html"
  status = 303
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
