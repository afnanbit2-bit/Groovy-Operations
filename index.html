<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Groovy Operations v2</title>
<link rel="stylesheet" href="/css/main.css?v=20260627b">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => { if(typeof window._swWatchForUpdate==='function') window._swWatchForUpdate(reg); })
      .catch(err => console.warn('[sw] registration failed:', err));
  });
}
</script>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="scr-login">
  <div class="login-box">
    <div class="login-logo">
      <img src="assets/groovy-operations-wordmark.png.png" alt="GROOVY Operations" style="height:38px;max-width:220px;object-fit:contain;display:block;margin:0 auto 4px" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <div class="l1" style="display:none">Groovy <span style="color:var(--red)">Operations</span> v2</div>
      <div class="l2">Internal business platform</div>
    </div>
    <div class="login-field-label">Username</div>
    <input id="l-user" placeholder="e.g. afnan" autocomplete="username" autocapitalize="none" onkeydown="if(event.key==='Enter')document.getElementById('l-pass').focus()">
    <div class="login-field-label">Password</div>
    <div style="position:relative;margin-bottom:4px">
      <input id="l-pass" type="password" placeholder="Enter your password" autocomplete="current-password" onkeydown="if(event.key==='Enter')window.doLogin();window._checkCapsLock(event)" onkeyup="window._checkCapsLock(event)" style="padding-right:42px;margin-bottom:0">
      <button type="button" id="pass-eye-btn" onclick="window._togglePass()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;color:var(--muted);display:flex;align-items:center">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="caps-warn" id="caps-warn">⇧ Caps Lock is on</div>
    <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;margin-bottom:10px">
      <input type="checkbox" id="l-remember" style="width:14px;height:14px;cursor:pointer"> Remember me
    </label>
    <button class="btn-login" id="login-btn" onclick="window.doLogin()">Sign in</button>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="scr-app" style="display:none;flex-direction:column;min-height:100vh">
  <div class="topbar">
    <div class="topbar-logo" onclick="window.showPage('dashboard')" style="cursor:pointer"><div class="brand-strip"><img src="assets/groovy-operations-wordmark.png.png" alt="GROOVY Operations v2" class="brand-wordmark" onerror="this.style.display='none';this.nextElementSibling.style.display='inline';"/><span class="brand-fallback">GROOVY OPERATIONS</span><span class="brand-version">v2</span></div></div>
    <div class="topbar-user">
      <div><div class="topbar-name" id="user-name"></div><div style="font-size:10px" id="user-title"></div></div>
      <button class="btn-logout" onclick="window.openChangePasswordModal()" title="Change your password">Change password</button>
      <button class="btn-logout" onclick="window.doLogout()">Sign out</button>
    </div>
  </div>
  <div class="app-body">
    <div id="sidebar"></div>
    <div id="main-content"></div>
  </div>
  <div id="mob-nav"></div>
</div>

<div class="mob-sheet-backdrop" id="mob-sheet-backdrop" onclick="window.closeMobSheet()"></div>
<div class="mob-sheet" id="mob-sheet" role="dialog" aria-modal="true">
  <div class="mob-sheet-handle"></div>
  <div class="mob-sheet-title" id="mob-sheet-title"></div>
  <div id="mob-sheet-items"></div>
</div>

<button id="bug-report-fab" type="button" style="display:none" onclick="window.openBugReportModal()" title="Report a bug"><span class="bug-fab-icon">🐛</span><span class="bug-fab-text">Report Bug</span></button>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="/js/shared.js?v=20260627b"></script>
<script src="/js/print-engine.js?v=20260627b"></script>
<script src="/js/auth.js?v=20260627b"></script>
<script src="/js/pos.js?v=20260627b"></script>
<script src="/js/embellishments.js?v=20260627b"></script>
<script src="/js/hrm.js?v=20260627b"></script>
<script src="/js/store.js?v=20260627b"></script>
<script src="/js/store-cash.js?v=20260627b"></script>
<script src="/js/gatepass.js?v=20260627b"></script>
<script src="/js/fabric.js?v=20260627b"></script>
<script src="/js/production.js?v=20260627b"></script>
<script src="/js/shopify.js?v=20260627b"></script>
<script src="/js/fulfillment.js?v=20260627b"></script>
<script src="/js/activity.js?v=20260627b"></script>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{initializeFirestore,persistentLocalCache,persistentMultipleTabManager,getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,addDoc,deleteDoc,query,orderBy,where,limit,runTransaction,writeBatch}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,updatePassword,reauthenticateWithCredential,EmailAuthProvider}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{getDatabase,ref as rtdbRef,get as rtdbGet,child as rtdbChild,onValue as rtdbOnValue,off as rtdbOff}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
const app=initializeApp({apiKey:'AIzaSyAcIrudpSPLbZMmoWMyTM1l8Z7GnxwelFw',authDomain:'groovy-gatepass.firebaseapp.com',projectId:'groovy-gatepass',storageBucket:'groovy-gatepass.appspot.com',messagingSenderId:'986200726255',appId:'1:986200726255:web:3a263cea3e7456d73c591a',databaseURL:'https://groovy-gatepass-default-rtdb.firebaseio.com'});
// Persistent local cache (IndexedDB) so reads work offline; multi-tab manager
// lets several open tabs share one cache instead of fighting over the lock.
// If persistence can't start (private browsing, unsupported browser, a
// same-origin tab already holding an incompatible single-tab lock, …) fall
// back to the default in-memory Firestore instance rather than breaking login.
let firestoreDb;
try{
  firestoreDb=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
}catch(e){
  console.warn('[firestore] persistent cache unavailable, falling back to in-memory cache:',e&&e.code||e);
  firestoreDb=getFirestore(app);
}
Object.assign(window,{
  db:firestoreDb, auth:getAuth(app), rtdb:getDatabase(app),
  collection,doc,getDoc,getDocs,setDoc,updateDoc,addDoc,deleteDoc,query,orderBy,where,limit,runTransaction,writeBatch,
  signInWithEmailAndPassword,signOut,onAuthStateChanged,
  updatePassword,reauthenticateWithCredential,EmailAuthProvider,
  rtdbRef,rtdbGet,rtdbChild,rtdbOnValue,rtdbOff
});
if(typeof window.__bootApp==='function')window.__bootApp();
</script>
</body>
</html>
